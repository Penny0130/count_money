<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>財源滾滾來 - 金錢運算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #ffffff; /* 更改為純白底色以抵抗反光 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-wrapper {
            width: 100%;
            height: 100%;
            background-color: #ffffff; 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 互動按鈕的實體下壓效果 */
        .btn {
            transition: all 0.1s ease-in-out;
        }
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000 !important;
        }
        .btn:disabled {
            transform: none;
            filter: grayscale(100%);
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* 高對比硬邊陰影取代柔和陰影 */
        .money-item {
            position: absolute;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,1));
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .bill-svg {
            /* 紙鈔不額外加 drop-shadow，統一由 money-item 控制 */
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .fade-out {
            opacity: 0 !important;
            transform: scale(0.5) !important;
        }
        #timer-bar {
            transition: width 0.1s linear;
        }
        
        /* 確保字體特粗 */
        .heavy-text {
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        
        <!-- ================= STREAMING_CHUNK:Start Screen High Contrast UI ================= -->
        <div id="start-screen" class="absolute inset-0 z-50 flex flex-col bg-[#F8F9FA] overflow-y-auto overflow-x-hidden p-6">
            <div class="flex-1 flex flex-col items-center justify-center w-full py-4 relative z-10">
                
                <!-- 全螢幕按鈕 (高對比) -->
                <button onclick="toggleFullScreen()" class="absolute top-2 right-2 p-3 bg-white hover:bg-gray-200 rounded-xl z-50 flex items-center justify-center btn border-4 border-black shadow-[4px_4px_0_#000]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#000" class="bi bi-arrows-fullscreen" viewBox="0 0 16 16">
                      <path fill-rule="evenodd" d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707zm4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707zm0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707zm-4.344 0a.5.5 0 0 1-.707 0L1.732 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707z"/>
                    </svg>
                </button>

                <!-- 標題 -->
                <h1 class="text-5xl md:text-6xl heavy-text text-black mb-3 text-center border-b-4 border-black pb-2 inline-block">💰 財源滾滾來</h1>
                <p class="text-xl md:text-2xl text-black mb-6 heavy-text text-center bg-[#FDE047] px-4 py-1 border-4 border-black shadow-[4px_4px_0_#000] -rotate-1">請計算畫面上總共有多少錢？</p>

                <!-- 秒數選擇區域 -->
                <div class="mb-6 flex flex-col items-center bg-white p-4 rounded-xl border-4 border-black shadow-[6px_6px_0_#000] w-full max-w-[320px] md:max-w-sm">
                    <span class="text-lg md:text-xl heavy-text text-black mb-3">⏱️ 選擇答題時間</span>
                    <div class="flex gap-3 w-full justify-center">
                        <button onclick="setGameTime(10)" id="time-btn-10" class="time-btn flex-1 py-2 rounded-lg text-lg font-black border-4 border-black text-black bg-white btn shadow-[4px_4px_0_#000]">10秒</button>
                        <button onclick="setGameTime(20)" id="time-btn-20" class="time-btn flex-1 py-2 rounded-lg text-lg font-black border-4 border-black text-black bg-white btn shadow-[4px_4px_0_#000]">20秒</button>
                        <button onclick="setGameTime(30)" id="time-btn-30" class="time-btn flex-1 py-2 rounded-lg text-lg font-black border-4 border-black text-white bg-black btn shadow-[4px_4px_0_#000]">30秒</button>
                    </div>
                </div>

                <!-- 關卡選擇按鈕 -->
                <div class="flex flex-col gap-4 w-full max-w-[300px] md:max-w-sm pb-8">
                    <button onclick="startGame(1)" class="btn bg-[#4ADE80] text-black heavy-text py-3 px-6 rounded-xl text-xl md:text-2xl border-4 border-black shadow-[6px_6px_0_#000]">
                        第一關 (簡單)
                    </button>
                    <button onclick="startGame(2)" class="btn bg-[#60A5FA] text-black heavy-text py-3 px-6 rounded-xl text-xl md:text-2xl border-4 border-black shadow-[6px_6px_0_#000]">
                        第二關 (中等)
                    </button>
                    <button onclick="startGame(3)" class="btn bg-[#F87171] text-black heavy-text py-3 px-6 rounded-xl text-xl md:text-2xl border-4 border-black shadow-[6px_6px_0_#000]">
                        第三關 (困難)
                    </button>
                    
                    <div class="w-full h-2 bg-black my-2 rounded-full"></div>
                    
                    <button onclick="startGame(4)" class="btn bg-[#C084FC] text-black heavy-text py-3 px-6 rounded-xl text-2xl border-4 border-black shadow-[6px_6px_0_#000]">
                        第四關 (記憶)
                    </button>
                    
                    <button onclick="startGame(5)" class="btn bg-[#2DD4BF] text-black heavy-text py-3 px-6 rounded-xl text-2xl border-4 border-black shadow-[6px_6px_0_#000]">
                        第五關 (減法)
                    </button>
                </div>
            </div>

            <!-- 署名置底 -->
            <div class="w-full pb-4 flex justify-center shrink-0 z-10">
                <div class="heavy-text text-base md:text-lg text-black bg-white px-4 py-1 border-4 border-black shadow-[4px_4px_0_#000]">
                    小遊戲製作: 丁琬珮
                </div>
            </div>
        </div>

        <!-- ================= STREAMING_CHUNK:Game Screen High Contrast UI ================= -->
        <div id="game-screen" class="hidden flex-1 flex flex-col w-full h-full relative bg-white">
            
            <div class="w-full bg-white border-b-4 border-black p-3 md:p-4 flex justify-between items-center z-20 shrink-0">
                <button onclick="goHome()" class="btn bg-gray-200 text-black heavy-text py-2 px-4 rounded-xl text-base md:text-xl shrink-0 border-4 border-black shadow-[4px_4px_0_#000]">
                    ⬅️ 返回
                </button>
                <div class="text-2xl md:text-4xl heavy-text text-black flex-1 text-center">
                    第 <span id="round-display" class="text-[#EF4444] text-4xl md:text-5xl border-b-4 border-black px-2">1</span> / <span id="total-rounds-display">10</span> 題
                </div>
                <div class="opacity-0 px-4 py-2 shrink-0 w-[80px] md:w-[120px]"></div>
            </div>

            <div class="w-full h-6 bg-gray-200 border-b-4 border-black shrink-0 relative overflow-hidden">
                <div id="timer-bar" class="h-full bg-black w-full border-r-4 border-black"></div>
            </div>

            <!-- 第五關提示框 -->
            <div id="shopping-prompt" class="hidden w-full bg-[#60A5FA] p-3 flex justify-center items-center z-10 shrink-0 border-b-4 border-black">
                <span class="text-xl md:text-3xl heavy-text text-black bg-white px-6 py-2 border-4 border-black shadow-[4px_4px_0_#000] rotate-1">今天出門總共花了 <span id="shopping-cost" class="text-[#EF4444] text-4xl mx-2 underline">0</span> 元</span>
            </div>

            <div id="money-area" class="flex-1 relative w-full bg-[#F3F4F6] overflow-hidden">
                <!-- Javascript 生成的錢幣放這裡 -->
            </div>

            <!-- 答案提示框 (高對比) -->
            <div id="result-overlay" class="hidden absolute bottom-28 md:bottom-32 left-0 right-0 z-40 pointer-events-none flex flex-col items-center justify-center">
                <div id="result-message" class="text-center heavy-text flex flex-col items-center pointer-events-auto">
                    <!-- 答案顯示區 -->
                </div>
            </div>

            <div class="w-full bg-[#E5E7EB] border-t-4 border-black p-4 flex flex-col md:flex-row items-center justify-center gap-4 z-20 relative h-auto md:h-[120px] shrink-0">
                <button onclick="showAnswer()" id="show-answer-btn" class="btn bg-[#FDE047] text-black heavy-text py-4 px-12 md:px-16 rounded-xl text-3xl md:text-5xl border-4 border-black shadow-[6px_6px_0_#000] transition-all w-full md:w-auto">
                    看正確解答
                </button>
                <button onclick="togglePause()" id="pause-btn" class="btn bg-[#FB923C] text-black heavy-text py-3 px-6 md:py-4 md:px-8 rounded-xl text-2xl md:text-3xl border-4 border-black shadow-[4px_4px_0_#000] flex items-center justify-center w-full md:w-auto md:absolute md:right-6">
                    ⏸️ 暫停
                </button>
            </div>
        </div>

        <!-- ================= STREAMING_CHUNK:Game Over Screen ================= -->
        <div id="game-over-screen" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-white p-6">
            <h2 class="text-5xl md:text-7xl heavy-text text-black mb-6 border-b-8 border-black pb-4 text-center bg-[#FDE047] px-8 py-2 -rotate-2">🎉 挑戰完成！</h2>
            <div class="text-3xl md:text-4xl text-black mb-10 heavy-text bg-white px-8 py-4 rounded-xl border-4 border-black shadow-[6px_6px_0_#000] text-center">難度：<span id="final-level" class="text-[#EF4444]"></span></div>
            <div class="flex flex-col md:flex-row gap-4 md:gap-6 w-full max-w-[300px] md:max-w-md justify-center">
                <button onclick="goHome()" class="btn bg-gray-300 text-black heavy-text py-4 px-8 md:px-10 rounded-xl text-2xl md:text-3xl border-4 border-black shadow-[6px_6px_0_#000] w-full">
                    回首頁
                </button>
                <button onclick="startGame(currentLevel)" class="btn bg-[#4ADE80] text-black heavy-text py-4 px-8 md:px-10 rounded-xl text-2xl md:text-3xl border-4 border-black shadow-[6px_6px_0_#000] w-full">
                    再玩一次
                </button>
            </div>
        </div>
    </div>

    <!-- ================= STREAMING_CHUNK:High Contrast SVG Assets & Scripts ================= -->
    <script>
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 高對比 SVG：極粗黑邊，純黑字體
        const SVGS = {
            coin1: `<svg class="money-item" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="46" fill="#e5e7eb" stroke="#000000" stroke-width="6"/><circle cx="50" cy="50" r="38" fill="none" stroke="#000000" stroke-width="2"/><text x="50" y="66" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#000000" text-anchor="middle">1</text></svg>`,
            coin5: `<svg class="money-item" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="46" fill="#d1d5db" stroke="#000000" stroke-width="6"/><circle cx="50" cy="50" r="38" fill="none" stroke="#000000" stroke-width="2"/><text x="50" y="66" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#000000" text-anchor="middle">5</text></svg>`,
            coin10: `<svg class="money-item" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="46" fill="#d1d5db" stroke="#000000" stroke-width="6"/><circle cx="50" cy="50" r="36" fill="none" stroke="#000000" stroke-width="3"/><text x="50" y="66" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#000000" text-anchor="middle">10</text></svg>`,
            coin50: `<svg class="money-item" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="46" fill="#fcd34d" stroke="#000000" stroke-width="6"/><circle cx="50" cy="50" r="36" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="4,2"/><text x="50" y="66" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#000000" text-anchor="middle">50</text></svg>`,
            bill100: `<svg class="money-item bill-svg" viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="234" height="104" rx="8" fill="#fca5a5" stroke="#000000" stroke-width="6"/><rect x="12" y="12" width="216" height="86" rx="4" fill="none" stroke="#000000" stroke-width="3"/><text x="120" y="70" font-family="Arial, sans-serif" font-size="55" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">100</text><text x="25" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#000000">壹佰圓</text></svg>`,
            bill500: `<svg class="money-item bill-svg" viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="234" height="104" rx="8" fill="#93c5fd" stroke="#000000" stroke-width="6"/><rect x="12" y="12" width="216" height="86" rx="4" fill="none" stroke="#000000" stroke-width="3"/><text x="120" y="70" font-family="Arial, sans-serif" font-size="55" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">500</text><text x="25" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#000000">伍佰圓</text></svg>`,
            bill1000: `<svg class="money-item bill-svg" viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="234" height="104" rx="8" fill="#bfdbfe" stroke="#000000" stroke-width="6"/><rect x="12" y="12" width="216" height="86" rx="4" fill="none" stroke="#000000" stroke-width="3"/><text x="120" y="70" font-family="Arial, sans-serif" font-size="55" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">1000</text><text x="25" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#000000">壹仟圓</text></svg>`
        };

        const ITEMS_DEF = [
            { val: 1, type: 'coin', w: 100, h: 100, svg: SVGS.coin1 },
            { val: 5, type: 'coin', w: 110, h: 110, svg: SVGS.coin5 },
            { val: 10, type: 'coin', w: 110, h: 110, svg: SVGS.coin10 },
            { val: 50, type: 'coin', w: 125, h: 125, svg: SVGS.coin50 },
            { val: 100, type: 'bill', w: 310, h: 145, svg: SVGS.bill100 },
            { val: 500, type: 'bill', w: 310, h: 145, svg: SVGS.bill500 },
            { val: 1000, type: 'bill', w: 310, h: 145, svg: SVGS.bill1000 }
        ];

        let totalRounds = 10;
        const LEVELS = {
            1: { name: '第一關 (簡單)', isMemoryMode: false },
            2: { name: '第二關 (中等)', isMemoryMode: false },
            3: { name: '第三關 (困難)', isMemoryMode: false },
            4: { name: '第四關 (記憶)', isMemoryMode: true },
            5: { name: '第五關 (減法)', isMemoryMode: false }
        };

        // ================= STREAMING_CHUNK:State and Game Logic Initialization =================
        let currentLevel = 1;
        let currentRound = 1;
        let currentTotal = 0;
        let currentAnswer = 0;
        let shoppingCost = 0;
        let timerInterval;
        let memoryTimeouts = [];
        let answerTimeout;
        let roundStartTimeout;
        let timeLeft = 0;
        let selectedTime = 30;
        let isSequencePlaying = false; 
        let isPaused = false; 

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const moneyArea = document.getElementById('money-area');
        const showAnswerBtn = document.getElementById('show-answer-btn');
        const resultOverlay = document.getElementById('result-overlay');
        const resultMessage = document.getElementById('result-message');
        const timerBar = document.getElementById('timer-bar');
        const shoppingPrompt = document.getElementById('shopping-prompt');

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            if (isPaused) {
                pauseBtn.innerHTML = '▶️ 繼續';
                pauseBtn.className = 'btn bg-[#EF4444] text-white heavy-text py-3 px-6 md:py-4 md:px-8 rounded-xl text-2xl md:text-3xl border-4 border-black shadow-[4px_4px_0_#000] flex items-center justify-center w-full md:w-auto md:absolute md:right-6';
            } else {
                pauseBtn.innerHTML = '⏸️ 暫停';
                pauseBtn.className = 'btn bg-[#FB923C] text-black heavy-text py-3 px-6 md:py-4 md:px-8 rounded-xl text-2xl md:text-3xl border-4 border-black shadow-[4px_4px_0_#000] flex items-center justify-center w-full md:w-auto md:absolute md:right-6';
            }
        }

        function resetPauseButton() {
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) {
                pauseBtn.innerHTML = '⏸️ 暫停';
                pauseBtn.className = 'btn bg-[#FB923C] text-black heavy-text py-3 px-6 md:py-4 md:px-8 rounded-xl text-2xl md:text-3xl border-4 border-black shadow-[4px_4px_0_#000] flex items-center justify-center w-full md:w-auto md:absolute md:right-6';
            }
        }

        function pausableSleep(ms) {
            let elapsed = 0;
            return new Promise(resolve => {
                const t = setInterval(() => {
                    if (!isPaused) {
                        elapsed += 100;
                    }
                    if (elapsed >= ms) {
                        clearInterval(t);
                        resolve();
                    }
                }, 100);
                memoryTimeouts.push(t);
            });
        }

        function setGameTime(seconds) {
            selectedTime = seconds;
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.className = 'time-btn flex-1 py-2 rounded-lg text-lg font-black border-4 border-black text-black bg-white btn shadow-[4px_4px_0_#000]';
            });
            const activeBtn = document.getElementById(`time-btn-${seconds}`);
            activeBtn.className = 'time-btn flex-1 py-2 rounded-lg text-lg font-black border-4 border-black text-white bg-black btn shadow-[4px_4px_0_#000]';
        }

        function clearAllTimers() {
            clearInterval(timerInterval);
            clearTimeout(answerTimeout);
            clearInterval(answerTimeout);
            clearTimeout(roundStartTimeout);
            clearInterval(roundStartTimeout);
            memoryTimeouts.forEach(t => {
                clearTimeout(t);
                clearInterval(t);
            });
            memoryTimeouts = [];
        }

        // ================= STREAMING_CHUNK:Game Flow Control =================
        function startGame(level) {
            clearAllTimers();
            currentLevel = level;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            void gameScreen.offsetWidth;

            currentRound = 1;
            totalRounds = (level === 5) ? 20 : 10;
            document.getElementById('total-rounds-display').innerText = totalRounds;
            
            if (currentLevel === 5) {
                shoppingPrompt.classList.remove('hidden');
            } else {
                shoppingPrompt.classList.add('hidden');
            }

            startRound();
        }

        function startRound() {
            isPaused = false;
            resetPauseButton();
            clearAllTimers();
            document.getElementById('round-display').innerText = currentRound;
            
            showAnswerBtn.disabled = false;
            showAnswerBtn.innerText = "看正確解答";
            showAnswerBtn.className = 'btn bg-[#FDE047] text-black heavy-text py-4 px-12 md:px-16 rounded-xl text-3xl md:text-5xl border-4 border-black shadow-[6px_6px_0_#000] transition-all w-full md:w-auto';
            
            moneyArea.innerHTML = ''; 
            resultOverlay.classList.add('hidden');
            isSequencePlaying = false;
            
            timeLeft = selectedTime;
            updateTimerDisplay();

            generateMoney();
            
            if (LEVELS[currentLevel].isMemoryMode) {
                playMemorySequence();
            } else {
                let startWait = 5; 
                roundStartTimeout = setInterval(() => {
                    if (isPaused) return; 
                    startWait--;
                    if (startWait <= 0) {
                        clearInterval(roundStartTimeout);
                        startTimer();
                    }
                }, 100);
            }
        }

        async function playMemorySequence() {
            isSequencePlaying = true;
            showAnswerBtn.disabled = true; 
            showAnswerBtn.innerText = "請專心記憶...";
            showAnswerBtn.classList.remove('bg-[#FDE047]');
            showAnswerBtn.classList.add('bg-gray-300');
            
            const items = moneyArea.querySelectorAll('.money-item-container'); 
            
            for (let i = 0; i < items.length; i++) {
                if (!isSequencePlaying) return; 

                const container = items[i];
                const svgChild = container.firstChild;
                
                svgChild.style.opacity = '1';
                svgChild.classList.remove('fade-out');
                svgChild.classList.add('animate-pop-in');
                
                await pausableSleep(2000); 
                if (!isSequencePlaying) return;
                
                svgChild.classList.remove('animate-pop-in');
                svgChild.classList.add('fade-out');
                
                await pausableSleep(800); 
            }
            
            if (isSequencePlaying) {
                showAnswerBtn.innerText = "看正確解答";
                showAnswerBtn.disabled = false;
                showAnswerBtn.classList.remove('bg-gray-300');
                showAnswerBtn.classList.add('bg-[#FDE047]');
                startTimer();
            }
        }

        function startTimer() {
            clearAllTimers();
            timerInterval = setInterval(() => {
                if (isPaused) return; 

                timeLeft -= 0.1;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearAllTimers();
                    timeLeft = 0;
                    updateTimerDisplay();
                    showAnswer(true); 
                }
            }, 100);
        }

        // 高對比計時器顯示
        function updateTimerDisplay() {
            const percentage = (timeLeft / selectedTime) * 100;
            timerBar.style.width = `${percentage}%`;
            
            if (percentage > 50) {
                timerBar.className = 'h-full bg-[#4ADE80] w-full border-r-4 border-black';
            } else if (percentage > 25) {
                timerBar.className = 'h-full bg-[#FBBF24] w-full border-r-4 border-black';
            } else {
                timerBar.className = 'h-full bg-[#EF4444] w-full border-r-4 border-black';
            }
        }

        // ================= STREAMING_CHUNK:Money Generation Engine =================
        function generateMoney() {
            currentTotal = 0;
            currentAnswer = 0;
            const areaWidth = moneyArea.clientWidth || window.innerWidth;
            const areaHeight = moneyArea.clientHeight || (window.innerHeight - 300);
            const paddingX = 40; 
            const paddingY = 30; 
            
            let targetMaxSum = 0;
            let availableItems = [];
            let maxItems = 0; 
            let minItems = 0; 

            if (currentLevel === 1) { 
                if (currentRound <= 2) { 
                    targetMaxSum = 30; availableItems = [1, 5, 10]; minItems = 2; maxItems = 3;
                } else if (currentRound <= 4) { 
                    targetMaxSum = 70; availableItems = [1, 5, 10]; minItems = 3; maxItems = 4;
                } else if (currentRound <= 6) { 
                    targetMaxSum = 120; availableItems = [1, 5, 10, 50]; minItems = 4; maxItems = 5;
                } else if (currentRound <= 8) { 
                    targetMaxSum = 200; availableItems = [5, 10, 50]; minItems = 5; maxItems = 6;
                } else { 
                    targetMaxSum = 300; availableItems = [10, 50]; minItems = 6; maxItems = 7;
                }
            } else if (currentLevel === 2) { 
                if (currentRound <= 3) { 
                    targetMaxSum = 250; availableItems = [1, 5, 10, 50, 100]; minItems = 3; maxItems = 4;
                } else if (currentRound <= 6) { 
                    targetMaxSum = 450; availableItems = [1, 5, 10, 50, 100]; minItems = 4; maxItems = 6;
                } else { 
                    targetMaxSum = 600; availableItems = [1, 5, 10, 50, 100]; minItems = 5; maxItems = 8;
                }
            } else if (currentLevel === 3) { 
                if (currentRound <= 3) { 
                    targetMaxSum = 1200; availableItems = [1, 5, 10, 50, 100, 500]; minItems = 3; maxItems = 5;
                } else if (currentRound <= 6) { 
                    targetMaxSum = 3000; availableItems = [1, 5, 10, 50, 100, 500, 1000]; minItems = 5; maxItems = 7;
                } else if (currentRound <= 8) { 
                    targetMaxSum = 5500; availableItems = [1, 5, 10, 50, 100, 500, 1000]; minItems = 6; maxItems = 8;
                } else { 
                    targetMaxSum = 8500; availableItems = [1, 5, 10, 50, 100, 500, 1000]; minItems = 8; maxItems = 10;
                }
            } else if (currentLevel === 4) { 
                if (currentRound <= 2) { 
                    targetMaxSum = 100; availableItems = [1, 5, 10, 50]; minItems = 2; maxItems = 3;
                } else if (currentRound <= 6) { 
                    targetMaxSum = 500; availableItems = [1, 5, 10, 50, 100]; minItems = 4; maxItems = 5;
                } else { 
                    targetMaxSum = 2500; availableItems = [1, 5, 10, 50, 100, 500, 1000]; minItems = 6; maxItems = 7;
                }
            } else if (currentLevel === 5) { 
                // 第五關漸進式數量 (1個 -> 2個 -> 3個 -> 4個 -> 5個)
                if (currentRound <= 4) { 
                    targetMaxSum = 100; availableItems = [50, 100]; minItems = 1; maxItems = 1;
                } else if (currentRound <= 8) { 
                    targetMaxSum = 300; availableItems = [50, 100]; minItems = 2; maxItems = 2;
                } else if (currentRound <= 12) { 
                    targetMaxSum = 800; availableItems = [100, 500]; minItems = 3; maxItems = 3;
                } else if (currentRound <= 16) { 
                    targetMaxSum = 1500; availableItems = [100, 500]; minItems = 4; maxItems = 4;
                } else { 
                    targetMaxSum = 3000; availableItems = [100, 500, 1000]; minItems = 5; maxItems = 6;
                }
            }

            let generatedItems = [];
            const MAX_TRIES_PER_ITEM = 400; 
            let keepGenerating = true;
            const targetItemsCount = Math.floor(Math.random() * (maxItems - minItems + 1)) + minItems;

            while (keepGenerating) {
                let val;
                
                if (currentLevel === 2 && generatedItems.length === 0) {
                    val = 100;
                } else if (currentLevel === 3 && generatedItems.length === 0) {
                    val = 500;
                } else {
                    const valIndex = Math.floor(Math.random() * availableItems.length);
                    val = availableItems[valIndex];
                }
                
                // 條件判斷：除非滿足「最低要求數量」，否則強制繼續產生錢幣
                if (currentTotal + val > targetMaxSum || generatedItems.length >= targetItemsCount) {
                    if (generatedItems.length >= minItems) {
                        break; 
                    }
                }

                const itemData = ITEMS_DEF.find(item => item.val === val);
                if (!itemData) continue;

                const w = itemData.w;
                const h = itemData.h;
                
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < MAX_TRIES_PER_ITEM) {
                    attempts++;
                    const left = paddingX + Math.random() * Math.max(1, (areaWidth - w - paddingX * 2));
                    const top = paddingY + Math.random() * Math.max(1, (areaHeight - h - paddingY * 2));

                    let overlap = false;
                    const buffer = 15; 
                    for (let existing of generatedItems) {
                        if (left < existing.left + existing.w + buffer &&
                            left + w + buffer > existing.left &&
                            top < existing.top + existing.h + buffer &&
                            h + top + buffer > existing.top) {
                            overlap = true;
                            break;
                        }
                    }

                    if (!overlap) {
                        generatedItems.push({ val: val, type: itemData.type, left: left, top: top, w: w, h: h, svg: itemData.svg });
                        currentTotal += val;
                        placed = true;
                    }
                }
                
                if (!placed) {
                    if (generatedItems.length >= minItems) {
                        keepGenerating = false;
                    }
                }
            }

            // --- 規則 1：強制第一至四關保底「至少有兩個錢幣」 ---
            while (currentLevel !== 5 && generatedItems.length < 2) {
                let lowestVal = Math.min(...availableItems);
                const itemData = ITEMS_DEF.find(item => item.val === lowestVal);
                if (!itemData) break;
                
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < MAX_TRIES_PER_ITEM) {
                    attempts++;
                    const left = paddingX + Math.random() * Math.max(1, (areaWidth - itemData.w - paddingX * 2));
                    const top = paddingY + Math.random() * Math.max(1, (areaHeight - itemData.h - paddingY * 2));
                    let overlap = false;
                    const buffer = 15; 
                    for (let existing of generatedItems) {
                        if (left < existing.left + existing.w + buffer &&
                            left + itemData.w + buffer > existing.left &&
                            top < existing.top + existing.h + buffer &&
                            itemData.h + top + buffer > existing.top) {
                            overlap = true;
                            break;
                        }
                    }
                    if (!overlap) {
                        generatedItems.push({ val: lowestVal, type: itemData.type, left: left, top: top, w: itemData.w, h: itemData.h, svg: itemData.svg });
                        currentTotal += lowestVal;
                        placed = true;
                    }
                }
                if (!placed) break; // 若畫面極度擁擠塞不下則強制放棄，避免當機
            }

            // --- 規則 2 & 3：第五關算出畫面總額後，再來扣抵隨機生成的小於總額的花費 (確保無負數) ---
            if (currentLevel === 5) {
                let cost = 0;
                if (currentRound >= 16) {
                    // 第16-20題：花費為不規則數字 (尾數不為 0, 5)，強迫計算畸零數
                    let maxCost = currentTotal - 3; // 最少找 3 元
                    if (maxCost < 3) maxCost = 3;
                    cost = Math.floor(Math.random() * (maxCost - 3 + 1)) + 3;
                    
                    // 確保尾數不是 0 或 5
                    while (cost % 5 === 0 && maxCost > 5) {
                         cost = Math.floor(Math.random() * (maxCost - 3 + 1)) + 3;
                    }
                } else {
                    // 前15題：花費為 5 或 10 的倍數
                    let maxCost = currentTotal - 5;
                    if (maxCost < 5) maxCost = 5;
                    let maxSteps = Math.floor(maxCost / 5);
                    let minSteps = 1;
                    cost = (Math.floor(Math.random() * (maxSteps - minSteps + 1)) + minSteps) * 5;
                }
                shoppingCost = cost;
                document.getElementById('shopping-cost').innerText = shoppingCost;
                currentAnswer = currentTotal - shoppingCost;
            } else {
                currentAnswer = currentTotal;
            }

            generatedItems.forEach((data) => {
                const el = document.createElement('div');
                el.className = 'money-item-container'; 
                el.style.position = 'absolute';
                el.style.left = `${data.left}px`;
                el.style.top = `${data.top}px`;
                el.style.width = `${data.w}px`;
                el.style.height = `${data.h}px`;
                el.innerHTML = data.svg;
                
                const svgChild = el.firstChild;
                
                if (LEVELS[currentLevel].isMemoryMode) {
                    svgChild.style.opacity = '0'; 
                } else {
                    svgChild.classList.add('animate-pop-in');
                    svgChild.style.animationDelay = `${Math.random() * 0.4}s`;
                }
                
                if (data.type === 'bill') {
                    const rot = (Math.random() * 16) - 8; 
                    svgChild.style.transform = `rotate(${rot}deg)`;
                }

                moneyArea.appendChild(el);
            });
        }

        // ================= STREAMING_CHUNK:Result Display & Flow =================
        function showAnswer(isTimeUp = false) {
            if (showAnswerBtn.disabled) return; 

            isSequencePlaying = false;
            clearAllTimers();
            showAnswerBtn.disabled = true;

            if (LEVELS[currentLevel].isMemoryMode) {
                const items = moneyArea.querySelectorAll('.money-item-container');
                items.forEach(container => {
                    const svgChild = container.firstChild;
                    svgChild.classList.remove('fade-out');
                    svgChild.classList.add('animate-pop-in'); 
                    svgChild.style.opacity = '1';
                });
            }

            resultOverlay.classList.remove('hidden');
            resultMessage.classList.remove('animate-pop-in');
            void resultMessage.offsetWidth; 
            resultMessage.classList.add('animate-pop-in');

            // 高對比結果視窗
            let titleHtml = isTimeUp ? '<div class="text-3xl text-black bg-[#FDE047] px-4 py-1 border-4 border-black shadow-[4px_4px_0_#000] -rotate-2">⏰ 時間到！</div>' : '<div class="text-3xl text-black bg-[#4ADE80] px-4 py-1 border-4 border-black shadow-[4px_4px_0_#000] -rotate-2">💡 正確解答</div>';
            
            if (currentLevel === 5) {
                resultMessage.innerHTML = titleHtml + '<div class="text-5xl md:text-6xl text-black font-black bg-white px-8 md:px-12 py-4 rounded-2xl border-8 border-black shadow-[8px_8px_0_#000] mt-3">應找回: ' + currentAnswer + ' 元</div>';
            } else {
                resultMessage.innerHTML = titleHtml + '<div class="text-5xl md:text-6xl text-black font-black bg-white px-8 md:px-12 py-4 rounded-2xl border-8 border-black shadow-[8px_8px_0_#000] mt-3">正確答案: ' + currentAnswer + ' 元</div>';
            }

            let waitTime = 40; 
            answerTimeout = setInterval(() => {
                if (isPaused) return; 
                
                waitTime--;
                if (waitTime <= 0) {
                    clearInterval(answerTimeout);
                    currentRound++;
                    if (currentRound > totalRounds) {
                        endGame();
                    } else {
                        startRound();
                    }
                }
            }, 100); 
        }

        function endGame() {
            gameScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            document.getElementById('final-level').innerText = LEVELS[currentLevel].name;
        }

        function goHome() {
            isSequencePlaying = false;
            isPaused = false;
            resetPauseButton();
            clearAllTimers();

            startScreen.classList.remove('hidden');
            gameScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
        }

    </script>
</body>
</html>
